<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Search Results | Chartered Institute of Management Specialists (CIMS)</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logos/cims-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#13233d;
    --charcoal:#241f1a;
    --paper:#FBF8F1;
    --parchment:#F6F1E4;
    --gold:#B08D57;
    --gold-light:#D8BD8A;
    --burgundy:#6E1423;
    --burgundy-dark:#4c0e18;
    --slate:#26241f;
    --slate-soft:#5b564c;
    --line: rgba(43,36,32,.14);
    --shadow: 0 20px 50px rgba(43,36,32,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--slate);
    font-family:'Inter',sans-serif;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:820px;margin:0 auto;padding:0 32px;}
  @media (max-width:700px){ .wrap{padding:0 20px;} }

  header.results-head{
    background:var(--charcoal);
    color:#e7ddce;
    padding:30px 0;
  }
  header.results-head a.back{
    color:var(--gold);
    font-family:'Sora',sans-serif;
    font-size:.78rem;
    letter-spacing:.05em;
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:16px;
  }
  header.results-head a.back:hover{color:var(--gold-light);}
  header.results-head h1{
    font-family:'Sora',sans-serif;
    font-size:1.4rem;
    margin:0 0 14px;
    color:#fff;
  }
  .results-search{
    display:flex;align-items:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(231,221,206,.28);
    border-radius:999px;
    overflow:hidden;
    max-width:480px;
  }
  .results-search input{
    flex:1;min-width:0;
    background:none;border:none;outline:none;
    padding:10px 4px 10px 18px;
    color:#e7ddce;
    font-family:'Inter',sans-serif;
    font-size:.88rem;
  }
  .results-search input::placeholder{color:rgba(231,221,206,.5);}
  .results-search button{
    background:var(--burgundy);
    border:none;margin:4px;
    width:30px;height:30px;flex-shrink:0;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;
  }
  .results-search button:hover{background:var(--burgundy-dark);}
  .results-search button svg{width:14px;height:14px;}

  main{padding:36px 0 90px;}
  .results-meta{
    font-family:'Sora',sans-serif;
    font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--slate-soft);
    margin:0 0 22px;
  }
  .results-meta strong{color:var(--burgundy);}

  .result-item{
    display:block;
    padding:18px 20px;
    background:var(--parchment);
    border:1px solid var(--line);
    border-left:3px solid var(--gold);
    margin-bottom:12px;
    transition:border-color .15s ease, background .15s ease;
  }
  .result-item:hover{border-left-color:var(--burgundy);background:#fff;}
  .result-item .r-section{
    font-family:'Sora',sans-serif;
    font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold);font-weight:600;
    display:block;margin-bottom:6px;
  }
  .result-item .r-title{
    font-family:'Sora',sans-serif;
    font-size:1.05rem;font-weight:700;
    color:var(--ink);
    display:block;
  }
  .result-item:hover .r-title{color:var(--burgundy);}

  .no-results{
    padding:40px 0;
    text-align:center;
    color:var(--slate-soft);
  }
  .no-results a{color:var(--burgundy);font-weight:700;}
</style>
</head>
<body>

<header class="results-head">
  <div class="wrap">
    <a class="back" href="index.html">&larr; Back to CIMS Home</a>
    <h1>Search Results</h1>
    <form class="results-search" role="search" id="resultsForm" autocomplete="off">
      <input type="search" id="resultsInput" name="q" placeholder="Search site" aria-label="Search site">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="results-meta" id="resultsMeta"></p>
    <div id="resultsList"></div>
  </div>
</main>

<script src="site-search.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const q = params.get('q') || '';
  const input = document.getElementById('resultsInput');
  const meta = document.getElementById('resultsMeta');
  const list = document.getElementById('resultsList');
  const form = document.getElementById('resultsForm');

  input.value = q;

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function renderResults(query) {
    const results = window.CIMS_SEARCH(query);

    if (!query.trim()) {
      meta.textContent = 'Type a page name or topic above to search the site.';
      list.innerHTML = '';
      return;
    }

    if (!results.length) {
      meta.innerHTML = 'No results for <strong>&ldquo;' + escapeHtml(query) + '&rdquo;</strong>';
      list.innerHTML = '<div class="no-results">Try a different term, or <a href="index.html">browse the homepage</a>.</div>';
      return;
    }

    meta.innerHTML = results.length + ' result' + (results.length === 1 ? '' : 's') + ' for <strong>&ldquo;' + escapeHtml(query) + '&rdquo;</strong>';
    list.innerHTML = results.map(p =>
      `<a class="result-item" href="${p.url}">
         <span class="r-section">${p.section}</span>
         <span class="r-title">${p.title}</span>
       </a>`
    ).join('');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const newQ = input.value.trim();
    const url = new URL(window.location.href);
    url.searchParams.set('q', newQ);
    window.history.replaceState({}, '', url);
    renderResults(newQ);
  });

  renderResults(q);
</script>

</body>
</html>
